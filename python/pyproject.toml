[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docworm"
version = "0.5.0"
description = "DocWorm SDK — document indexing, knowledge graphs, reasoning RAG, and chat"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Hopperbase", email = "team@b-ctrl.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.urls]
Homepage = "https://github.com/Hopperbase/docworm-sdk"
Documentation = "https://github.com/Hopperbase/docworm-sdk#readme"
Repository = "https://github.com/Hopperbase/docworm-sdk"
Issues = "https://github.com/Hopperbase/docworm-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
