name: CI & PyPI Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" httpx websockets
      - name: Run Python SDK tests
        run: python -m pytest python/tests -q

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
        working-directory: typescript
      - name: Run TypeScript SDK tests
        run: npm test
        working-directory: typescript
      - name: Build TypeScript SDK
        run: npm run build
        working-directory: typescript

  build-and-publish:
    if: github.event_name == 'release'
    needs: [python-tests, typescript-tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -oP '__version__ = "\K[^"]+' python/docworm/__init__.py)"
          echo "release tag: ${TAG}  package: ${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match docworm.__version__ ${PKG}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
        working-directory: python
      - name: Check artifacts with twine
        run: python -m twine check python/dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
